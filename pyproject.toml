[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "officecheck"
version = "0.1.0"
description = "Deterministic checks that grade whether an office file (docx, xlsx, pptx, pdf) meets a goal."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "jsonschema>=4.18",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=8", "fpdf2>=2.7"]

[project.scripts]
officecheck = "officecheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
officecheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
